cat << 'EOF' > templates/index.html
<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>ClipTube Native</title></head>
<body>
    <div style="padding:20px; font-family:sans-serif;">
        <input id="url" placeholder="Link YouTube" style="width:100%; padding:10px;"><br><br>
        <input id="start" placeholder="Mulai (e.g. 03:58)" style="width:100%; padding:10px;"><br><br>
        <input id="end" placeholder="Selesai (e.g. 06:45)" style="width:100%; padding:10px;"><br><br>
        <select id="res" style="width:100%; padding:10px;">
            <option value="720">720p</option>
            <option value="1080">1080p</option>
        </select><br><br>
        <button onclick="startDownload()" style="width:100%; padding:15px; background:blue; color:white;">Download Sekarang</button>
        <p id="msg"></p>
    </div>
    <script>
    async function startDownload() {
        document.getElementById('msg').innerText = "Sedang memproses di server... Tunggu sebentar, browser akan memulai download otomatis.";
        const response = await fetch('/download', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                url: document.getElementById('url').value,
                start: document.getElementById('start').value,
                end: document.getElementById('end').value,
                resolution: document.getElementById('res').value
            })
        });
        if(response.ok) {
            const blob = await response.blob();
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = "video_clip.mp4";
            document.body.appendChild(a);
            a.click();
            document.getElementById('msg').innerText = "Download Selesai!";
        } else {
            document.getElementById('msg').innerText = "Gagal memproses.";
        }
    }
    </script>
</body>
</html>
EOF
