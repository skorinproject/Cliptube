<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipTube - Pemotong Video YouTube</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; text-align: center; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        input, button { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background-color: #ff0000; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:disabled { background-color: #cccccc; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>ClipTube Video Trimmer</h2>
    <input type="text" id="url" placeholder="Masukkan Link YouTube">
    <input type="text" id="start" placeholder="Waktu Mulai (contoh: 00:10 atau 10)">
    <input type="text" id="end" placeholder="Waktu Selesai (contoh: 00:30 atau 30)">
    <button id="btn" onclick="processVideo()">Potong Video</button>
    <div id="status"></div>
</div>

<script>
async function processVideo() {
    const url = document.getElementById('url').value;
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;
    const status = document.getElementById('status');
    const btn = document.getElementById('btn');

    if (!url || !start || !end) {
        status.innerText = "Semua kolom wajib diisi!";
        status.style.color = "red";
        return;
    }

    status.innerText = "Memproses video... Mohon tunggu.";
    status.style.color = "blue";
    btn.disabled = true;

    try {
        const response = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ url: url, start_time: start, end_time: end })
        });

        const data = await response.json();

        if (response.ok) {
            status.innerHTML = `<a href="${data.download_url}" download style="color: green;">Klik di sini untuk mengunduh hasil video!</a>`;
        } else {
            status.innerText = data.error || "Terjadi kesalahan.";
            status.style.color = "red";
        }
    } catch (err) {
        status.innerText = "Gagal terhubung ke server. Periksa koneksi internet kamu.";
        status.style.color = "red";
    } finally {
        btn.disabled = false;
    }
}
</script>

</body>
</html>
