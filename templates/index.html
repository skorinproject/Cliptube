<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipTube - YouTube Video Trimmer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { background: #1e293b; padding: 25px; border-radius: 16px; width: 100%; max-width: 480px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 1px solid #334155; }
        .logo-title { text-align: center; margin-bottom: 20px; }
        .logo-title h1 { font-size: 24px; font-weight: 700; background: linear-gradient(135deg, #ff4b4b 0%, #ff8533 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo-title p { font-size: 13px; color: #94a3b8; margin-top: 4px; }
        
        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 500; color: #cbd5e1; margin-bottom: 6px; }
        input, select { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: #fff; font-size: 14px; outline: none; }
        
        /* Player Preview Box */
        .preview-box {
            position: relative;
            padding-bottom: 56.25%; /* Ratio 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 10px;
            background: #000;
            margin-bottom: 16px;
            display: none; /* Sembunyi sebelum link diisi */
            border: 1px solid #334155;
        }
        .preview-box iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .time-group { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff4b4b 0%, #e63946 100%); color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 18px; text-align: center; font-size: 14px; }
        .download-btn { display: inline-block; background: #10b981; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; margin-top: 10px; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,.3); border-radius: 50%; border-top-color: #fff; animation: spin 1s ease-in-out infinite; vertical-align: middle; margin-right: 8px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .error-msg { color: #f87171; background: rgba(248, 113, 113, 0.1); padding: 10px; border-radius: 6px; }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-title">
        <h1>ClipTube UI Modern</h1>
        <p>Potong & Unduh Bagian Video YouTube Kamu</p>
    </div>

    <div class="form-group">
        <label for="url">URL Video YouTube</label>
        <input type="text" id="url" placeholder="https://www.youtube.com/watch?v=..." oninput="loadPreview()">
    </div>

    <div id="preview-box" class="preview-box">
        <iframe id="youtube-player" src="" allowfullscreen></iframe>
    </div>

    <div class="time-group">
        <div class="form-group">
            <label for="start">Waktu Mulai</label>
            <input type="text" id="start" placeholder="00:00:10">
        </div>
        <div class="form-group">
            <label for="end">Waktu Selesai</label>
            <input type="text" id="end" placeholder="00:00:30">
        </div>
    </div>

    <div class="form-group">
        <label for="quality">Kualitas Video</label>
        <select id="quality">
            <option value="1080">1080p (Full HD)</option>
            <option value="720" selected>720p (HD)</option>
            <option value="480">480p (SD)</option>
            <option value="360">360p (Rendah)</option>
        </select>
    </div>

    <button id="btn-submit" onclick="processVideo()">Potong Video Sekarang</button>

    <div id="status"></div>
</div>

<script>
// Fungsi untuk memuat pemutar video secara otomatis
function loadPreview() {
    const urlInput = document.getElementById('url').value;
    const previewBox = document.getElementById('preview-box');
    const player = document.getElementById('youtube-player');

    let videoId = extractVideoId(urlInput);

    if (videoId) {
        player.src = `https://www.youtube.com/embed/${videoId}?enablejsapi=1`;
        previewBox.style.display = 'block';
    } else {
        previewBox.style.display = 'none';
        player.src = '';
    }
}

// Fungsi mengekstrak ID video YouTube dari berbagai format Link
function extractVideoId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
}

async function processVideo() {
    const status = document.getElementById('status');
    const btn = document.getElementById('btn-submit');
    const url = document.getElementById('url').value;
    const start = document.getElementById('start').value;
    const end = document.getElementById('end').value;

    if (!url || !start || !end) {
        status.innerHTML = `<div class="error-msg">Semua kolom wajib diisi!</div>`;
        return;
    }

    btn.disabled = true;
    btn.style.opacity = '0.7';
    status.innerHTML = `<span class="spinner"></span> Sedang memotong video... Mohon tunggu.`;

    const payload = {
        url: url,
        start_time: start,
        end_time: end,
        quality: document.getElementById('quality').value
    };

    try {
        const res = await fetch('/download', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const data = await res.json();
        if (res.ok) {
            status.innerHTML = `<a href="${data.download_url}" class="download-btn" download>📥 Unduh Hasil Potongan</a>`;
        } else {
            status.innerHTML = `<div class="error-msg">${data.error}</div>`;
        }
    } catch (err) {
        status.innerHTML = `<div class="error-msg">Gagal terhubung ke server.</div>`;
    } finally {
        btn.disabled = false;
        btn.style.opacity = '1';
    }
}
</script>

</body>
</html>
